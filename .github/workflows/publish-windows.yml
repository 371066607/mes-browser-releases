name: Publish verified Windows packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version validated by the full suite'
        required: true
        type: string
      verification_run:
        description: 'Successful full verification run on the build repository main branch'
        required: true
        type: string
      source_build_run:
        description: 'Original Windows build run (no rebuilding during publication)'
        required: true
        type: string
      artifact_sha256:
        description: 'SHA-256 of the already verified artifact archive'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-windows-release
  cancel-in-progress: false
jobs:
  validate-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require trusted publication branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Publication requires the release repository main branch' >&2
          exit 1
  publish:
    needs: validate-ref
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check release rejection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Publish exact verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_PACKAGE_ARTIFACT_URL: ${{ secrets.WINDOWS_PACKAGE_ARTIFACT_URL }}
          EXPECTED_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          PACKAGE_VERSION: ${{ inputs.version }}
          VERIFICATION_RUN: ${{ inputs.verification_run }}
          SOURCE_BUILD_RUN: ${{ inputs.source_build_run }}
          WINDOWS_BUILD_READ_TOKEN: ${{ secrets.WINDOWS_BUILD_READ_TOKEN }}
        run: python3 .github/scripts/publish-windows.py
